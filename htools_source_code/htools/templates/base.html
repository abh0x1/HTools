<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">

            <!-- Logo -->
            <a href="/" class="text-2xl font-bold text-indigo-600 tracking-wide">
                HTOOLS
            </a>

            <!-- Auth Buttons -->
            <div class="flex items-center gap-4 text-sm font-medium">

                {% if user.is_authenticated %}

                <span class="text-gray-500 hidden sm:inline">
                    Welcome, {{ user.username }}
                </span>

                <a href="{% url 'accounts:logout' %}"
                    class="px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition">
                    Logout
                </a>

                {% else %}

                <a href="{% url 'accounts:login' %}"
                    class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                    Login
                </a>

                <a href="{% url 'accounts:register' %}"
                    class="px-4 py-2 border border-indigo-600 text-indigo-600 rounded-lg hover:bg-indigo-50 transition">
                    Register
                </a>

                {% endif %}

            </div>
        </div>
    </nav>


    <!-- Page Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>


    <!-- Footer -->
    <footer class="bg-white border-t mt-20">
        <div class="max-w-6xl mx-auto px-6 py-8 text-center text-sm text-gray-500 space-y-2">

            <p class="font-medium text-gray-700">
                HTools – Cybersecurity Utility Dashboard
            </p>

            <p>
                Built by Abhishek Kumar Verma | Final Semester BCA CS&F Project
            </p>

            <p class="text-xs text-gray-400">
                © 2026 All Rights Reserved
            </p>

        </div>
    </footer>

</body>

</html>
