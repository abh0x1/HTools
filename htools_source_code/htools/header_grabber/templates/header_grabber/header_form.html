{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-100 py-12 px-4">

    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl p-10">

        <!-- Back -->
        <a href="{% url 'home:dashboard' %}" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
            ← Back to Dashboard
        </a>

        <!-- Title -->
        <h1 class="text-3xl font-bold mt-6 mb-2 text-gray-800">
            HTTP Header Grabber
        </h1>

        <p class="text-gray-600 text-sm mb-8">
            Analyze HTTP response and important security headers of any website.
        </p>

        <!-- Form Card -->
        <div class="bg-blue-50 rounded-xl p-8 shadow-inner">

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-semibold text-blue-700 mb-2">
                        Website URL
                    </label>

                    <input type="url" name="url" placeholder="https://example.com" required class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm
                               focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>

                <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                    Analyze Headers
                </button>

            </form>

        </div>

    </div>
</div>
{% endblock %}
