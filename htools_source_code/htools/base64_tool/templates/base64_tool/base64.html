{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-100 py-12 px-4">

    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl p-10">

        <!-- Title -->
        <h2 class="text-3xl font-bold text-center mb-8 text-gray-800">
            Base64 Encoder / Decoder
        </h2>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <!-- Input Area -->
            <div>
                <label class="block mb-2 font-medium text-gray-700">
                    Enter Text
                </label>

                <textarea name="text" rows="6"
                    class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none"
                    placeholder="Enter text here..." required></textarea>
            </div>

            <!-- Buttons -->
            <div class="flex flex-wrap gap-4">

                <button type="submit" name="operation" value="encode"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                    Encode
                </button>

                <button type="submit" name="operation" value="decode"
                    class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition">
                    Decode
                </button>

                <button type="reset"
                    class="bg-gray-200 text-gray-800 px-6 py-3 rounded-lg hover:bg-gray-300 transition">
                    Clear
                </button>

                <a href="{% url 'home:dashboard' %}"
                    class="bg-gray-800 text-white px-8 py-3 rounded-lg hover:bg-black transition text-center">
                    Back to Dashboard
                </a>

            </div>
        </form>

        <!-- Result Section -->
        {% if result %}
        <div class="mt-10 bg-blue-50 p-8 rounded-xl shadow-inner">

            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-blue-700">
                    Result
                </h3>

                <button onclick="copyResult()"
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">
                    Copy
                </button>
            </div>

            <textarea id="resultBox" rows="6" readonly
                class="w-full p-4 border border-blue-200 rounded-lg bg-white resize-none">{{ result }}</textarea>
        </div>
        {% endif %}

        <!-- Error -->
        {% if error %}
        <div class="mt-6 bg-red-100 text-red-700 p-4 rounded-lg">
            {{ error }}
        </div>
        {% endif %}

        <!-- Back -->
        <!-- Buttons Row -->
        <div class="flex flex-col sm:flex-row justify-center gap-4 pt-8 print:hidden">

            <button onclick="window.print()"
                class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 transition">
                Print Report
            </button>

        </div>

    </div>
</div>

<script>
    function copyResult() {
        const copyText = document.getElementById("resultBox");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
    }
</script>

{% endblock %}
