{% extends "base.html" %}

{% block content %}
<section class="max-w-3xl mx-auto px-6 py-14">

    <!-- Heading -->
    <div class="mb-10">
        <h2 class="text-3xl font-bold text-gray-800 mb-2">
            URL Status Checker
        </h2>
        <p class="text-gray-500 text-sm">
            Enter one or multiple URLs to check their availability and response status.
        </p>
    </div>

    <!-- Form Card -->
    <div class="bg-white border rounded-xl p-8 shadow-sm">

        <form method="post" action="{% url 'url_status_checker:check_status' %}" class="space-y-6">

            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Enter URLs (one per line)
                </label>

                <textarea name="urls" rows="6" placeholder="https://example.com
https://google.com"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">
                Check Status
            </button>

        </form>
    </div>

    <!-- Back Button -->
    <div class="mt-10">
        <a href="{% url 'home:dashboard' %}" class="text-indigo-600 hover:underline text-sm">
            ← Back to Dashboard
        </a>
    </div>

</section>
{% endblock %}
