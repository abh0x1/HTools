{% extends "base.html" %}

{% block content %}
<section class="max-w-3xl mx-auto px-6 py-14">

    <!-- Heading -->
    <div class="mb-10">
        <h2 class="text-3xl font-bold text-gray-800 mb-2">
            Password Generator
        </h2>
        <p class="text-gray-500 text-sm">
            Generate secure random passwords using customizable options.
        </p>
    </div>

    <!-- Form Card -->
    <div class="bg-white border rounded-xl p-8 shadow-sm">

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <!-- Length -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Password Length
                </label>
                <input type="number" name="length" required min="4"
                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Options -->
            <div class="grid grid-cols-2 gap-4 text-sm text-gray-700">
                <label class="flex items-center gap-2">
                    <input type="checkbox" name="uppercase" class="accent-indigo-600">
                    Include Uppercase
                </label>

                <label class="flex items-center gap-2">
                    <input type="checkbox" name="lowercase" class="accent-indigo-600">
                    Include Lowercase
                </label>

                <label class="flex items-center gap-2">
                    <input type="checkbox" name="digits" class="accent-indigo-600">
                    Include Numbers
                </label>

                <label class="flex items-center gap-2">
                    <input type="checkbox" name="symbols" class="accent-indigo-600">
                    Include Symbols
                </label>
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">
                Generate Password
            </button>
        </form>
    </div>


    <!-- Result Section -->
    {% if password %}
    <div class="mt-10 bg-white border rounded-xl p-6 shadow-sm">

        <h3 class="text-lg font-semibold text-gray-800 mb-4">
            Generated Password
        </h3>

        <div class="flex flex-col sm:flex-row gap-4 items-center">
            <input type="text" value="{{ password }}" readonly class="flex-1 border rounded-lg px-4 py-2 bg-gray-50">

            <button onclick="window.print()"
                class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                Print
            </button>
        </div>
    </div>
    {% endif %}


    <!-- Error -->
    {% if error %}
    <div class="mt-6 text-red-600 text-sm">
        {{ error }}
    </div>
    {% endif %}


    <!-- Back Button -->
    <div class="mt-10">
        <a href="{% url 'home:dashboard' %}" class="text-indigo-600 hover:underline text-sm">
            ← Back to Dashboard
        </a>
    </div>

</section>
{% endblock %}
